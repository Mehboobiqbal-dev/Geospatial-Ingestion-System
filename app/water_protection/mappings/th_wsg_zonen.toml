# Source-to-destination mapping for the Thuringia water protection zone layer.
#
# STATUS: UNVERIFIED (schema_verified = false)
#
# The specified endpoint https://geoportal.thueringen.de/wfs/wsg could not
# be inspected on 2026-10-27: scripted requests received an HTML bot-protection
# (CAPTCHA) page with HTTP 200, and a browser that passed the check received a
# TYPO3 "404 Page Not Found". The property names below are therefore
# ASSUMPTIONS used by the clearly labelled synthetic test fixtures, not facts
# about the official schema.
#
# Before loading real data:
#   1. python -m app.water_protection inspect --output inspection.json
#   2. Compare the DescribeFeatureType properties with the names below and
#      correct them; confirm every zone code in [[zone_classification]]
#      against the publisher's documentation.
#   3. Set schema_verified = true and bump version.
# Staging loads refuse to run while schema_verified = false unless the
# operator passes --allow-unverified-mapping explicitly.
#
# Conventions
#   * A destination attribute mapped to "" is NOT PUBLISHED by the source:
#     it stays NULL and the record carries an explicit status. Values are
#     never derived from other attributes (for example an extraction rate
#     is never parsed out of a name or remark).
#   * Zone codes are matched EXACTLY after trimming outer whitespace. There
#     is no case folding, no substring and no similarity matching. Any code
#     not listed is stored with category UNKNOWN and its raw value preserved.
#     Spelling variants are added only as explicit rows once verified.

[mapping]
version = "2026-10-27.1"
layer = "th_wsg_zonen"
state_code = "TH"
schema_verified = false
verification_note = "Live schema not inspectable (bot protection / HTTP 404 on 2026-10-27); property names are fixture assumptions."

[source]
zone_id = "zone_id"   # stable identifier of the individual zone polygon (required)
geometry = "geom"     # GML geometry property

[fields]
state_code = ""                           # layer is Thuringia-only; state code comes from [mapping].state_code
protection_area_id = "wsg_nr"             # identifier of the parent protection area
protection_area_name = "wsg_name"
zone_code = "zone"                        # official zone code, classified via [[zone_classification]]
zone_label = "zone_bez"                   # zone designation text as published (stored verbatim)
restriction_category = ""                 # not known to be published
legal_status = "status"                   # e.g. designation status as published (stored verbatim)
legal_basis = "rechtsgrundlage"           # ordinance reference as published (stored verbatim)
legal_effective_date = "datum_festsetzung"
source_modified_date = "aenderungsdatum"
extraction_rate = ""                      # not known to be published -> stays NULL ("not_published")
extraction_rate_unit = ""

# Zone types follow the German drinking-water protection zone scheme
# (DVGW Arbeitsblatt W 101). The legal restrictions of an individual zone
# are set by its own protection-area ordinance (Paragraphs 51 and 52 WHG);
# legal_description names the zone type only and is not a restriction list.

[[zone_classification]]
source_code = "I"
category = "ZONE_I"
legal_description = "Schutzzone I (Fassungsbereich)"
basis = "DVGW W 101 zone type; legal effect per the individual WSG ordinance (Paragraphs 51, 52 WHG)"

[[zone_classification]]
source_code = "II"
category = "ZONE_II"
legal_description = "Schutzzone II (Engere Schutzzone)"
basis = "DVGW W 101 zone type; legal effect per the individual WSG ordinance (Paragraphs 51, 52 WHG)"

[[zone_classification]]
source_code = "III"
category = "ZONE_III"
legal_description = "Schutzzone III (Weitere Schutzzone)"
basis = "DVGW W 101 zone type; legal effect per the individual WSG ordinance (Paragraphs 51, 52 WHG)"

[[zone_classification]]
source_code = "IIIA"
category = "ZONE_IIIA"
legal_description = "Schutzzone III A (Weitere Schutzzone, Teilzone A)"
basis = "DVGW W 101 subdivision of zone III; legal effect per the individual WSG ordinance (Paragraphs 51, 52 WHG)"

[[zone_classification]]
source_code = "IIIB"
category = "ZONE_IIIB"
legal_description = "Schutzzone III B (Weitere Schutzzone, Teilzone B)"
basis = "DVGW W 101 subdivision of zone III; legal effect per the individual WSG ordinance (Paragraphs 51, 52 WHG)"
