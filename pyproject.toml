[project]
name = "nrw-dc-bi"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.18.5",
    "beautifulsoup4>=4.15.0",
    "contextily>=1.7.1",
    "feedparser>=6.0.14",
    "folium>=0.20.0",
    "geoalchemy2>=0.20.0",
    "geopandas>=1.1.4",
    "loguru>=0.7.3",
    "lxml>=6.1.1",
    "markdown>=3.10.3",
    "matplotlib>=3.11.1",
    "numpy>=2.5.1",
    "openai>=2.52.0",
    "pandas>=3.0.5",
    "plotly>=6.9.0",
    "psycopg2-binary>=2.9.12",
    "psycopg[binary]>=3.3.4",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.2",
    "pydeck>=0.9.3",
    "pyogrio>=0.13.0",
    "pyproj>=3.7.2",
    "pyshp>=3.1.6",
    "python-dotenv>=1.2.2",
    "reportlab>=5.0.0",
    "requests>=2.34.2",
    "shapely>=2.1.2",
    "sqlalchemy>=2.0.51",
    "streamlit>=1.60.0",
    "streamlit-elements>=0.1.0",
    "streamlit-folium>=0.27.3",
    "streamlit-option-menu>=0.4.0",
]

[dependency-groups]
dev = [
    "lxml-stubs>=0.5.1",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "responses>=0.26.3",
    "ruff>=0.17.3",
    "types-requests>=2.33.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers"
markers = [
    "integration: needs a disposable PostGIS test database (IRIS_TEST_DATABASE_URL)",
]

# Lint and type-check settings cover the water protection ingestion code;
# run them on those paths (see docs/wsg_th/README.md).
[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.ruff.lint.isort]
force-single-line = true
known-third-party = ["alembic"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_unused_ignores = true
check_untyped_defs = true

[[tool.mypy.overrides]]
module = ["app.water_protection.*", "app.database.staging.*"]
disallow_untyped_defs = true
