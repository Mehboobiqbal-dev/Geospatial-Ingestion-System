# Alembic environment for the iris_staging schema only.
#
# Kept separate from alembic.ini (iris_core) so that staging migrations can
# never create or alter iris_core objects, and so the existing
# "alembic upgrade head" workflow is unaffected.
#
#   alembic -c alembic_staging.ini upgrade head
#   python -m app.water_protection init-db        (same, with the guard first)
#
# The database URL comes from IRIS_STAGING_DATABASE_URL and is validated by
# app.database.staging.guard before any connection is opened.

[alembic]
script_location = %(here)s/alembic_staging
prepend_sys_path = .
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
